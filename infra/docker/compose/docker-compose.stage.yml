version: "3.8"

services:
  web:
    image: ${REGISTRY}/${REPO}-web:${WEB_TAG}
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml
    restart: unless-stopped
    networks: [app_net]

  backend:
    image: ${REGISTRY}/${REPO}-backend:${BACKEND_TAG}
    environment:
      ML_BASE_URL: http://ml:9000
    expose:
      - "8000"
    depends_on:
      - ml
      - mysql
    restart: unless-stopped
    networks: [app_net]

  ml:
    image: ${REGISTRY}/${REPO}-ml:${ML_TAG}
    expose:
      - "9000"
    restart: unless-stopped
    networks: [app_net]

  mysql:
    image: mysql:8.0
    env_file:
      - ../env/backend.env
    command: --default-authentication-plugin=mysql_native_password
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks: [app_net]

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge
